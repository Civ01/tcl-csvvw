; tcl-csvvw - Total Commander Lister CSV/TSV table viewer
; Most options can also be changed in the settings window: right-click in the
; table > Settings... (only the values you change are rewritten; comments stay).
; Toggles in the right-click menu (header, row numbers, ...) are saved here too.
; This file must stay next to tcl-csvvw.wlx64. Encoding: UTF-8 (UTF-8 with BOM,
; UTF-16 with BOM and ANSI also work; the settings window keeps the encoding).
; Comments must be on their own line (a ";" after a value is part of the value).
; Changes apply the next time a file is opened in Lister, EXCEPT "extensions":
; TC caches the detect string when the plugin is installed - see README.md.

[General]
; File extensions handled by the plugin (comma-separated, no dots).
extensions=csv,tsv,tab

; Larger files are not parsed; a notice is shown instead. Bytes, or K / M / G.
max_file_size=100M

; Characters per cell that are drawn and measured. Longer cells end with "...".
; Search and copy always use the full cell text. Range 256 .. 1M.
max_cell_chars=32K

; Delimiter: auto | , | ; | tab | pipe   (right-click > Delimiter overrides it per file)
delimiter=auto

; Encoding: auto | utf8 | utf16le | utf16be | ansi   (right-click > Encoding overrides it per file)
encoding=auto

; First row is header: auto | on | off
;   auto = detect (a text row above numeric/date columns is a header);
;          when the detection is inconclusive, header_default decides.
header_mode=auto
; Written by the right-click "First row is header" checkbox.
header_default=true

; Column typing, in percent of a column's non-empty cells (50 .. 100):
;   type_threshold        - cells that must be numbers / dates for the column to sort
;                           as numbers / dates and to be right-aligned
;   header_type_threshold - the same, used only by the header detection: a text first
;                           row above such a column means "header"
type_threshold=90
header_type_threshold=75

; Font of the table (any installed font). Ctrl+Mouse wheel zooms at runtime.
font_face=Segoe UI
font_size=10

; Zoom in percent (50 .. 400). With remember_zoom=true the last zoom is saved here.
zoom=100
remember_zoom=true

; Column widths in pixels at 100% zoom (scaled with zoom and DPI).
;   auto_size_columns: off | largest | typical   (right-click > Auto-size columns)
;     largest = fit the column's widest value, up to max_auto_width
;     typical = fit the value length at auto_size_percentile of the column's
;               non-empty cells (90 = 90% of the values fit; a few very long
;               values do not widen the column and are shown with "...")
;   max_fit_width: hard limit for "Fully-fit last column" and divider double-click.
auto_size_columns=largest
auto_size_percentile=90
max_auto_width=400
min_column_width=40
default_column_width=100
max_fit_width=4000

; Last column: normal | fit | wrap   (right-click > Last column)
;   fit  = as wide as its widest cell (up to max_fit_width)
;   wrap = wrap long text, filling the window width; rows grow (max_cell_lines)
last_column=normal

; Show the cell's own line breaks as separate lines (rows grow up to max_cell_lines).
; Off: line breaks are shown as a dim glyph on one line.
multiline_cells=false
max_cell_lines=8

; A cell's own line breaks are drawn as a dim "↵". If the table font has no such
; glyph, this character is used instead (one character).
linebreak_fallback=¶

show_row_numbers=true
freeze_first_column=false
show_status_bar=true
zebra_rows=true
align_numbers_right=true

; Colors: auto (follow Total Commander's dark mode) | light | dark
theme=auto

; Troubleshooting: write tcl-csvvw.log next to the DLL (or in %TEMP%).
debug_log=false

; Color overrides as #RRGGBB (empty = built-in). Keys:
;   background, text, grid_lines, header_background, header_text,
;   alt_row_background, selection_background, selection_text,
;   current_cell_border, search_hit_background, gutter_background, gutter_text,
;   frozen_divider, glyph, info_background, info_text
[ColorsLight]
; grid_lines=#E1E1E1

[ColorsDark]
; background=#1E1E1E
